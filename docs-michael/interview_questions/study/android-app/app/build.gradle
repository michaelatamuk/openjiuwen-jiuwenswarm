plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jiuwenswarm.study'
    compileSdk 35

    defaultConfig {
        applicationId "com.jiuwenswarm.study"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Offline app: no compressed assets needed; keep them uncompressed for fast WebView loads.
    aaptOptions {
        noCompress 'json'
    }
}

dependencies {
    // Align all Kotlin stdlib artifacts (AndroidX pulls an older kotlin-stdlib-jdk8).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
